name: Deploy Live Preview Webpage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install trmnlp preview
        run: gem install trmnl_preview

      - name: Build Static HTML Preview
        run: |
          # Runs the native CLI build command, outputs to _build/
          trmnlp build
          
          # Optional: Copy your main layout file to index.html so GitHub Pages loads it automatically at the root URL
          # (Check if your main layout file is full.html or index.html inside _build/)
          if [ -f "_build/full.html" ]; then
            cp _build/full.html _build/index.html
          elif [ -f "_build/index.html" ]; then
            echo "index.html already exists"
          else
            # Fallback copy of the first available HTML file in _build
            cp _build/*.html _build/index.html || true
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4