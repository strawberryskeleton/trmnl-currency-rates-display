name: Deploy Live Preview Webpage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install trmnlp preview
        run: gem install trmnl_preview

      - name: Generate Static HTML Preview
        run: |
          mkdir -p public
          trmnlp serve -p 4567 &
          SERVER_PID=$!
          sleep 4
          curl -s http://localhost:4567 > public/index.html
          kill $SERVER_PID

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4